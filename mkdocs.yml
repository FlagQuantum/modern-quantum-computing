      - Architecture-review sources: references/architecture-review.md
      - Exact proof-plan sources: references/proof-sources.md
      - H₂ integral-to-model provenance: references/h2-provenance.md
      - Topological experimental evidence: references/topological-experiments.md
      - Topological comment/reply argument audit: references/topological-dispute-review.md
      - Nielsen–Chuang design review: references/nielsen-chuang-design-review.md
      - Quantum Country design review: references/quantum-country-design-review.md
  - Sources and validation: sources.md
  - Editions and publication: publication.md
markdown_extensions:
  - md_in_html
  - admonition
  - pymdownx.superfences
  - pymdownx.arithmatex:
      generic: true
extra_javascript:
