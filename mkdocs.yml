site_name: 'Modern Quantum Computing: A Formula-to-Code Approach'
site_author: Wei Liu
site_url: https://flagquantum.github.io/modern-quantum-computing/
site_description: An open textbook connecting equations, FlagQuantum code, and independent verification.
repo_url: https://github.com/FlagQuantum/modern-quantum-computing
repo_name: FlagQuantum/modern-quantum-computing
theme:
  name: material
  features:
    - navigation.sections
    - content.code.copy
nav:
  - Introduction: index.md
  - Editorial charter: editorial-charter.md
  - Curriculum audit: curriculum-audit.md
  - Reader continuity: reader-continuity.md
  - Contents and status: contents.md
  - Full book plan: book-plan.md
  - Detailed section plans:
      - Overview: section-plan.md
      - 'Part 1: Foundations and Quantum Information Primitives': section-plans/01-foundations.md
      - 'Part 2: Quantum Information: Channels, Inference, and Communication': section-plans/02-information.md
      - 'Part 3: Quantum Algorithms and Computational Resources': section-plans/03-algorithms.md
      - 'Part 4: Variational and Differentiable Quantum Computing': section-plans/04-variational.md
      - 'Part 5: Noise, Error Correction, and Fault-Tolerant Computation': section-plans/05-fault-tolerance.md
      - 'Part 6: Physical Realizations and Quantum-System Architecture': section-plans/physical-platforms.md
      - 'Part 7: Quantum Programming, Compilation, and Control': section-plans/quantum-compilation.md
      - 'Part 8: Classical Simulation and the Boundary of Tractability': section-plans/06-simulation.md
      - 'Part 9: From Papers to Reproducible Research': section-plans/07-research.md
  - Learning design: learning-design.md
  - FlagQuantum implementation roadmap: implementation-roadmap.md
  - Conventions: conventions.md
  - Starter chapters:
      - Measurement and expectations: chapters/measurement.md
      - Circuits and gradients: chapters/gradients.md
      - Hydrogen VQE: chapters/vqe.md
  - References:
      - Reading guide: references/reading-guide.md
      - Chapter mapping: references/chapter-mapping.md
      - Compilation and physical platforms: references/compilation-and-platforms.md
      - Nielsen–Chuang design review: references/nielsen-chuang-design-review.md
      - Quantum Country design review: references/quantum-country-design-review.md
  - Sources and validation: sources.md
  - Editions and publication: publication.md
markdown_extensions:
  - admonition
  - pymdownx.superfences
  - pymdownx.arithmatex:
      generic: true
extra_javascript:
  - assets/mathjax.js
  - https://cdn.jsdelivr.net/npm/mathjax@3.2.2/es5/tex-mml-chtml.js
