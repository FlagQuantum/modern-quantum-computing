  - Textbook and agent entries:
      - Shared design and navigation: dual-entry.md
      - Skills levels and chapter map: agent-skills.md
      - First comparison skill prototype: comparison-skill-prototype.md
      - Independent blind evaluation: comparison-skill-blind-evaluation.md
      - Second skill - qubit interference: interference-skill-prototype.md
      - Third skill - phase-tracked evolution: unitary-evolution-skill-prototype.md
      - Fourth skill - complex linear algebra: complex-algebra-skill-prototype.md
      - Four-skill composition experiment: four-skill-integration.md
      - Paper-to-skills Ramsey transfer: paper-ramsey-transfer.md
      - Task contract and evaluation: skill-contract.md
      - Paper verification and acceptance: paper-reproduction-standard.md
  - Writing baseline 1.0: writing-baseline.md
  - Full writing queue: writing-order.md
  - First writing assignment: writing-first-batch.md
  - Editorial charter: editorial-charter.md
  - Curriculum audit: curriculum-audit.md
  - Systematic architecture review: architecture-review.md
  - Section review ledger: section-review.md
  - Checked learning paths: learning-paths.md
  - Adopted seven-volume plan: volume-plan.md
  - Core results and proof depth:
      - Overview: proof-plan.md
      - Foundations: proof-plans/01-foundations.md
      - Information: proof-plans/02-information.md
      - Algorithms: proof-plans/03-algorithms.md
      - Differentiable and hybrid computing: proof-plans/04-variational.md
      - Noise and fault tolerance: proof-plans/05-fault-tolerance.md
      - Physical platforms: proof-plans/physical-platforms.md
      - Compilation and control: proof-plans/quantum-compilation.md
      - Classical simulation: proof-plans/06-simulation.md
      - Research and capstones: proof-plans/07-research.md
  - Reader continuity: reader-continuity.md
  - Quantum-classical hybrid computing: hybrid-computing.md
  - Contents and status: contents.md
  - Full book plan: book-plan.md
  - Detailed section plans:
      - Overview: section-plan.md
      - 'Part 1: Foundations and Quantum Information Primitives': section-plans/01-foundations.md
      - 'Part 2: Quantum Information: Channels, Inference, and Communication': section-plans/02-information.md
      - 'Part 3: Quantum Algorithms and Computational Resources': section-plans/03-algorithms.md
      - 'Part 4: Variational and Differentiable Quantum Computing': section-plans/04-variational.md
      - 'Part 5: Noise, Error Correction, and Fault-Tolerant Computation': section-plans/05-fault-tolerance.md
      - 'Part 6: Physical Realizations and Quantum-System Architecture': section-plans/physical-platforms.md
      - 'Part 7: Quantum Programming, Compilation, and Control': section-plans/quantum-compilation.md
      - 'Part 8: Classical Simulation and the Boundary of Tractability': section-plans/06-simulation.md
      - 'Part 9: From Papers to Reproducible Research': section-plans/07-research.md
