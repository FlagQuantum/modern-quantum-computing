      - "Chapter 2: Complex Vectors, Operators, and Numerical Reasoning": chapters/ch-complex-vectors-operators-and-numerical-reasoning.md
      - "Chapter 3: Single-Qubit States and Rotations": chapters/ch-single-qubit-states-and-rotations.md
      - "Chapter 4: Composite Systems, Tensor Products, and Qubit Ordering": chapters/ch-composite-systems-tensor-products-and-qubit-ordering.md
      - "Chapter 5: Gates, Reversible Computation, and Circuit Synthesis": chapters/ch-gates-reversible-computation-and-circuit-synthesis.md
