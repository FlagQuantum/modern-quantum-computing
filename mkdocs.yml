site_name: 'Modern Quantum Computing: A Formula-to-Code Approach'
site_author: Wei Liu
site_url: https://flagquantum.github.io/modern-quantum-computing/
site_description: An open textbook connecting equations, FlagQuantum code, and independent verification.
repo_url: https://github.com/FlagQuantum/modern-quantum-computing
repo_name: FlagQuantum/modern-quantum-computing
theme:
  name: material
  features:
    - navigation.sections
    - content.code.copy
nav:
  - Introduction: index.md
  - Editorial charter: editorial-charter.md
  - Contents and status: contents.md
  - Full book plan: book-plan.md
  - Learning design: learning-design.md
  - FlagQuantum implementation roadmap: implementation-roadmap.md
  - Conventions: conventions.md
  - Starter chapters:
      - Measurement and expectations: chapters/measurement.md
      - Circuits and gradients: chapters/gradients.md
      - Hydrogen VQE: chapters/vqe.md
  - References:
      - Reading guide: references/reading-guide.md
      - Chapter mapping: references/chapter-mapping.md
      - Nielsen–Chuang design review: references/nielsen-chuang-design-review.md
      - Quantum Country design review: references/quantum-country-design-review.md
  - Sources and validation: sources.md
  - Editions and publication: publication.md
markdown_extensions:
  - admonition
  - pymdownx.superfences
  - pymdownx.arithmatex:
      generic: true
extra_javascript:
  - assets/mathjax.js
  - https://cdn.jsdelivr.net/npm/mathjax@3.2.2/es5/tex-mml-chtml.js
