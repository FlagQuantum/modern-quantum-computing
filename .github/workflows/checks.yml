name: Verify book
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-docs.txt
      - run: python scripts/build_book.py --web-metadata
      - run: git diff --exit-code -- docs/index.md
      - run: python scripts/build_curriculum.py --check
      - run: python scripts/review_curriculum.py --check
      - run: python scripts/build_scholarly_plan.py --check
      - run: python scripts/build_writing_baseline.py --check
      - run: python scripts/build_agent_skills_plan.py --check
      - run: python scripts/check_prose.py
      - run: python scripts/verify_topology_logic.py
      - run: python -m mkdocs build --strict
  examples:
    runs-on: ubuntu-latest
    env:
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      MPLBACKEND: Agg
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-examples.txt
      - run: python examples/foundations/task_contracts.py
      - run: python examples/foundations/interference.py
      - run: python examples/foundations/state_descriptions.py
      - run: python examples/foundations/execution_evidence.py
      - run: python examples/foundations/advantage_ledger.py
