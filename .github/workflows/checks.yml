name: Verify book
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-docs.txt
      - run: python scripts/build_book.py --web-metadata
      - run: git diff --exit-code -- docs/index.md
      - run: python scripts/build_curriculum.py --check
      - run: python scripts/review_curriculum.py --check
      - run: python scripts/build_scholarly_plan.py --check
      - run: python scripts/build_writing_baseline.py --check
      - run: python scripts/build_agent_skills_plan.py --check
      - run: python scripts/check_prose.py
      - run: python scripts/verify_topology_logic.py
      - run: python -m mkdocs build --strict
  examples:
    runs-on: ubuntu-latest
    env:
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      MPLBACKEND: Agg
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-examples.txt
      - run: python examples/foundations/task_contracts.py
      - run: python examples/foundations/interference.py
      - run: python examples/foundations/state_descriptions.py
      - run: python examples/foundations/execution_evidence.py
      - run: python examples/foundations/advantage_ledger.py
      - run: python examples/foundations/learning_routes.py
      - run: python examples/foundations/complex_coordinates.py
      - run: python examples/foundations/inner_products.py
      - run: python examples/foundations/basis_changes.py
      - run: python examples/foundations/operator_classes.py
      - run: python examples/foundations/spectral_svd.py
      - run: python examples/foundations/matrix_functions.py
      - run: python examples/foundations/conditioning.py
      - run: python examples/foundations/verification_contracts.py
      - run: python examples/foundations/pure_states.py
      - run: python examples/foundations/relative_phase.py
      - run: python examples/foundations/bloch_sphere.py
      - run: python examples/foundations/closed_evolution.py
      - run: python examples/foundations/pauli_rotations.py
      - run: python examples/foundations/composing_rotations.py
      - run: python examples/foundations/phase_contracts.py
      - run: python examples/foundations/tensor_spaces.py
      - run: python scripts/check_tensor_spaces_prose.py
      - run: python examples/foundations/register_indices.py
      - run: python scripts/check_register_indices_prose.py
      - run: python scripts/check_formula_code.py
      - run: python scripts/check_comparison_skill.py
      - run: python scripts/check_blind_comparison_evidence.py
      - run: python scripts/check_interference_skill.py
      - run: python scripts/check_interference_blind_evidence.py
      - run: python scripts/check_unitary_skill.py
      - run: python scripts/check_unitary_blind_evidence.py
      - run: python scripts/check_algebra_skill.py
      - run: python scripts/check_algebra_blind_evidence.py
      - run: python scripts/check_algebra_retest_evidence.py
      - run: python scripts/check_four_skill_integration.py
      - run: python scripts/check_four_skill_blind_evidence.py
      - run: python scripts/check_paper_ramsey_transfer.py
      - run: python examples/measurement.py
      - run: python examples/gradients.py
      - run: python examples/omalley2016/h2_vqe_model.py
      - run: python examples/omalley2016/verify_h2_vqe.py
      - run: python examples/omalley2016/reproduce_h2_curve.py
      - run: python examples/omalley2016/train_h2_vqe.py
      - run: python examples/omalley2016/sample_h2_energy.py
  chemistry-provenance:
    runs-on: ubuntu-latest
    env:
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-provenance.txt
      - run: python scripts/verify_h2_provenance.py
